<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Nostálgica</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header>
        <h1>TV Nostálgica</h1>
        <p>Embarque em uma viagem pelas relíquias que marcaram a televisão brasileira!</p>
    </header>

    <main>

        <section class="login">
            <h2>Participar da votação</h2>
            <p>
                Digite seu nome e o código fornecido pela organização.
            </p>

            <form>

                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="codigo">Código de acesso:</label>
                    <input type="password" id="codigo" name="codigo" placeholder="Digite o código" required>
                </div>

                <button type="submit" id="botaoContinuar">
                    Continuar
                </button>

            </form>
            <p id="mensagem"></p>

        </section>

        <section id="menu" class="oculto">
            <header>
                <h1>TV Nostálgica</h1>
                <h2 id="boas-vindas"></h2>
                <p>O que deseja fazer?</p>
            </header>

            <div class="opcoes">
                <button id="botaoFoto">Fotos</button>
                <button id="botaoVotar">Votar</button>
                <button id="placar">Placar</button>
            </div>
        </section>

    </main>

    <footer>
        <p>TV Nostálgica 2026 - feito pelo melhor programador do CEPI Parque dos Buritis</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>

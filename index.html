<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Nostálgica</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <h1>TV Nostálgica</h1>
        <p> Embarque em uma viagem pelas relíquias que marcaram a televisão brasileira!</p>
    </header>

    <main>

        <section class="login">
            <h2>Participar da votação</h2>
            <p>
                Digite seu nome e o código fornecido pela organização.
            </p>

            <form>

                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="codigo">Código de acesso:</label>
                    <input type="password" id="codigo" name="codigo" placeholder="Digite o código" required>
                </div>

                <button type="submit">
                    Continuar
                </button>

            </form>
        </section>

    </main>
    <footer>
        <p> Tv Nostalgia 2026- feito por o melhor aluno do CEPI parque dos buritis</p>
    </footer>

</body>

</html>
